<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor de mapa</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font: 14px system-ui, sans-serif; background: #1d1f22; color: #ddd }
    aside { width: 300px; flex: none; overflow-y: auto; padding: 12px; box-sizing: border-box; background: #26292d }
    main { flex: 1; min-width: 0; position: relative; overflow: hidden }
    #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair }
    #vista3d { position: absolute; inset: 0 }
    a.voltar { color: #8aa; font-size: 12px; text-decoration: none }
    h3 { margin: 14px 0 4px; font-size: 13px; color: #aab }
    .nota { font-size: 12px; color: #9a9; margin-top: 6px }
    .linha { display: flex; gap: 6px; align-items: center; margin: 4px 0 }
    .linha > * { flex: 1; min-width: 0 }
    .linha > .fixo { flex: none }
    aside { overflow-x: hidden }
    #formato { width: auto; flex: none; padding: 5px }
    select, button, input { font: inherit }
    select, button { width: 100%; padding: 6px; margin: 4px 0; background: #3a3f45; color: #eee; border: 1px solid #555; box-sizing: border-box }
    button { cursor: pointer; font-weight: 600 }
    button:disabled { opacity: .45; cursor: default }
    button.ativo { background: #5a6b7d; border-color: #8aa }
    input[type=text], input[type=number] { background: #1d1f22; color: #ddd; border: 1px solid #444; padding: 4px; min-width: 0; box-sizing: border-box }
    input[type=number] { width: 56px }
    .linha input[type=text] { width: 100% }
    #ferramentas { display: grid; grid-template-columns: 1fr 1fr; gap: 4px }
    #ferramentas button { margin: 0; padding: 5px 4px; font-size: 12px; font-weight: 500 }
    #ferramentas small { color: #9ab; font-size: 10px }
    #niveis { display: flex; flex-wrap: wrap; gap: 4px }
    #niveis button { width: auto; margin: 0; padding: 4px 8px; font-size: 12px }
    .sala { border: 1px solid #444; border-radius: 6px; padding: 6px; margin: 6px 0 }
    .sala.ativa { border-color: #8aa }
    .sala .linha button { width: auto; flex: none; margin: 0; padding: 4px 8px; font-size: 12px }
    .sala select { margin: 2px 0 }
    /* celular: canvas em cima (60dvh), barra embaixo com rolagem própria; alvos de toque maiores */
    @media (max-width: 700px) {
      body { flex-direction: column; height: 100dvh }
      main { order: -1; flex: none; height: 60dvh }
      aside { width: 100%; flex: 1; min-height: 0 }
      select, button, input { font-size: 16px }
      select, button { padding: 10px }
      input[type=number] { width: 72px; padding: 6px }
    }
  </style>
</head>
<body>
  <aside>
    <a class="voltar" href="index.html">← Peças</a>
    <h3>Mapa</h3>
    <div class="linha"><input id="nome" type="text" value="Mapa" title="Nome do mapa (também vira o nome do arquivo)"></div>
    <div class="linha">
      <select id="formato" class="fixo" title="Formato: fixo depois de criado"><option value="quadrado">Quadrado</option><option value="hexagono">Hexágono</option></select>
      <input id="largura" type="number" value="35" min="15" max="100" step="1" title="Largura (mm)"><span>mm</span>
    </div>
    <button id="novo">Novo mapa</button>
    <div class="linha"><button id="abrirBtn">Abrir…</button><button id="salvarBtn">Salvar</button></div>
    <select id="modelo" title="Carrega um modelo pronto (vai para o desfazer)"><option value="">Novo a partir de modelo…</option></select>
    <input id="arquivo" type="file" accept=".json,application/json" hidden>
    <div class="linha"><button id="desfazer" title="Ctrl+Z">Desfazer</button><button id="refazer" title="Ctrl+Y">Refazer</button></div>
    <button id="alternaVista">2D / 3D</button>
    <div id="barra3d" hidden>
      <label class="linha"><input id="soCaixas" type="checkbox"> Só caixas (L0)</label>
      <div class="nota" id="progresso"></div>
    </div>

    <h3>Ferramenta</h3>
    <div id="ferramentas"></div>
    <button id="sentido">Sentido: +x (tecla R)</button>
    <h3>Textura atual</h3>
    <select id="textura"></select>

    <h3>Nível</h3>
    <div id="niveis"></div>
    <div class="linha"><input id="nomeNivel" type="text" title="Nome do nível"></div>
    <div class="linha"><span>Base (degraus)</span><input id="base" type="number" min="0" max="12" step="1"></div>
    <button id="excluirNivel">Excluir nível</button>

    <h3>Salas do nível</h3>
    <div id="salas"></div>
    <button id="novaSala">Nova sala</button>
    <div class="nota" id="estado"></div>
  </aside>
  <main id="tela">
    <canvas id="cv"></canvas>
    <div id="vista3d" hidden></div>
  </main>
  <script type="module" src="/src/mapa/main.ts"></script>
</body>
</html>
