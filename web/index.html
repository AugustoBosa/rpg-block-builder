<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPG Block Builder</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; font: 14px system-ui, sans-serif; background: #1d1f22; color: #ddd }
    aside { width: 300px; overflow-y: auto; padding: 12px; box-sizing: border-box; background: #26292d }
    main { flex: 1; min-width: 0; overflow: hidden; position: relative }
    /* desktop: controles | vista 3D | esquemas (#meio junta vista e esquemas) */
    #meio { flex: 1; display: flex; min-width: 0 }
    aside#dir { width: 340px; flex: none }
    #dir summary { display: none } /* desktop: esquemas sempre abertos, sem recolher */
    #dir div[style*="grid-template"] { grid-template-columns: 1fr !important } /* 340 px: uma coluna de esquemas */
    @media (max-width: 1099px) {
      /* vista 3D em cima e esquemas embaixo, recolhidos por padrão */
      #meio { flex-direction: column; overflow-y: auto }
      main { flex: none; height: 60dvh }
      aside#dir { width: auto }
      #dir summary { display: block }
    }
    /* aba para recolher/abrir o painel de esquemas (desktop) */
    #meio { position: relative }
    #abaDir { position: absolute; top: 50%; right: 340px; transform: translateY(-50%); width: 24px; height: 104px; padding: 0; margin: 0; z-index: 6; writing-mode: vertical-rl; font-size: 12px; border-radius: 6px 0 0 6px }
    #meio.sem-dir aside#dir { display: none }
    #meio.sem-dir #abaDir { right: 0 }
    /* barra "Vista 3D" sobre a vista (como o cabeçalho do Blender) */
    .barra { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; background: rgba(29,31,34,.82) }
    .barra button { width: auto; margin: 0; padding: 4px 9px; font-size: 12px; font-weight: 500 }
    .barra button.ativo, .pop button.ativo { background: #5a6b7d; border-color: #8aa }
    .seg { display: flex } .seg button { border-radius: 0; margin-left: -1px } .seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0 } .seg button:last-child { border-radius: 0 4px 4px 0 }
    .barra[data-passo="2"] .so1, .barra[data-passo="3"] .so1 { display: none }
    .pop { display: none; position: absolute; top: 100%; z-index: 7; width: 220px; padding: 4px 10px 8px; background: #26292d; border: 1px solid #555; border-radius: 0 0 6px 6px }
    .pop.aberto { display: block }
    .pop .seg button { padding: 4px 14px }
    @media (max-width: 1099px) { #abaDir { display: none } }
    nav { display: flex; gap: 6px }
    nav button { flex: 1; padding: 6px 2px; white-space: nowrap; font-size: 12px }
    nav button.ativo { background: #5a6b7d; border-color: #8aa }
    label { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; margin: 6px 0 }
    label input[type=range] { grid-column: 1 / 3 }
    label select { grid-column: 1 / 3 }
    input[type=number] { width: 60px; background: #1d1f22; color: #ddd; border: 1px solid #444 }
    select, button { width: 100%; padding: 6px; margin: 6px 0; background: #3a3f45; color: #eee; border: 1px solid #555 }
    button { cursor: pointer; font-weight: 600 }
    summary { cursor: pointer; margin: 10px 0 4px; font-weight: 600 }
    h3 { margin: 14px 0 4px; font-size: 13px; color: #aab }
    .nota { font-size: 12px; color: #9a9 }
    #aviso { font-size: 12px; color: #e9a35a }
    /* celular: prévia em cima (fixa), controles embaixo com rolagem própria; alvos de toque maiores */
    @media (max-width: 700px) {
      body { flex-direction: column; height: 100dvh }
      main { order: -1; flex: none; height: 42dvh }
      aside { width: 100%; flex: 1; min-height: 0 }
      label { grid-template-columns: 1fr 80px; margin: 10px 0 }
      input[type=number] { width: 76px; font-size: 16px; padding: 4px }
      input[type=range] { height: 28px }
      select, button { font-size: 16px; padding: 10px }
      /* celular: #meio some (filhos viram da coluna); esquemas recolhidos no fim, com rolagem própria */
      #meio { display: contents }
      aside#dir { width: 100%; flex: none; max-height: 35dvh }
    }
  </style>
</head>
<body>
  <aside>
    <nav><button id="ir1" class="ativo">1 · Sistema</button><button id="ir2">2 · Grids</button><button id="ir3">3 · Blocos</button></nav>
    <div id="saida" hidden><button id="baixar">Baixar STL</button><div class="nota" id="estado"></div></div>
    <section id="passo1">
      <div id="sistema"></div>
      <div id="aviso"></div>
    </section>
    <section id="passo2" hidden>
      <details open name="passo2"><summary>Peça</summary><div><label>Peça <select id="peca3"><option value="grid">Grid</option><option value="degrau">Degrau (adaptador de nível)</option></select></label></div></details>
      <div id="op-guias"></div>
    </section>
    <section id="passo3" hidden>
      <div id="gerais"></div>
      <div id="pedra"></div>
    </section>
  </aside>
  <div id="meio">
    <main id="vista"></main>
    <button id="abaDir" title="Recolher ou abrir os esquemas">Esquemas ▸</button>
    <aside id="dir"><details id="esquemas"><summary>Esquemas</summary><div id="dirc"></div></details></aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
